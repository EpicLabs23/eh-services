services:
  phpmyadmin:
    image: 'phpmyadmin/phpmyadmin:latest'
    container_name: ehm-phpmyadmin
    restart: unless-stopped
    # Caps the default json-file driver's growth - previously unbounded.
    # See ehm-api/docs/CLEANUP_POLICY.md's "Follow-on work" section.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      # Was PMA_ARBITRARY=1 - lets phpMyAdmin's own login form connect to
      # *any* MySQL host the visitor types in, not just the pre-configured
      # server. Removed: the real access path here is ehm-authentication's
      # signon flow (login.php), which always supplies the exact host/user/
      # password programmatically via ehm-api's /account/mysqlcred -
      # arbitrary-server entry was never needed for that and only expanded
      # what an attacker who reaches phpMyAdmin directly (bypassing the
      # signon redirect) could attempt to connect to.
      - TZ=${TZ:?err}
      - UPLOAD_LIMIT=${UPLOAD_LIMIT:?900M}
    # Deliberately no `ports:`. The host's nginx serves phpMyAdmin over TLS
    # on 2329 for each account's primary domain (EHM's DbToolsVhostService,
    # see ehm-api docs/NGINX.md) and proxies to 172.1.0.5:80 below. It used
    # to be published as plain HTTP on 0.0.0.0:2329, which broke on
    # HSTS-preloaded domains (.dev, .app, ...) and sent the ECP sign-on token
    # in clear text. nginx can't take 2329 while Docker still holds it, so
    # after `docker compose up -d` here, restart EHM (or POST
    # /nginx/db-tools/sync) to bring the vhosts up.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      eh_network:
        ipv4_address: 172.1.0.5
    volumes:
     - /sessions
     - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
     - ./ehm-authentication:/var/www/html/ehm-authentication/
     - ./theme/:/www/themes/theme/
networks:
  eh_network:
    external: true
    name: eh_network