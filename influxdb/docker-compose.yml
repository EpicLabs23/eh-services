services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    restart: unless-stopped
    # Previously published to all interfaces (0.0.0.0:8181) - only ehm-api's
    # resource-monitor collectors, running on this same host, ever query it
    # (INFLUXDB_HOST=http://localhost:8181 in ehm-api's .env already), so
    # restricting the bind address doesn't require any application-side
    # change. See docs/SECURITY_CHECKLIST.md in ehm-api.
    ports:
      - '127.0.0.1:8181:8181'
    volumes:
      - './data:/var/lib/influxdb3/data'
      - './plugins:/var/lib/influxdb3/plugins'
      - './heal-entrypoint.sh:/usr/local/bin/heal-entrypoint.sh:ro'
    # Wraps the image's own entrypoint so a single corrupted wal/ or dbs/ file left by an
    # unclean shutdown (host crash, power loss) gets deleted and retried automatically
    # instead of crash-looping forever. See heal-entrypoint.sh and
    # docs/eh-services/install-influxdb.md in eh-documentation for what it does and doesn't touch.
    entrypoint:
      - /usr/local/bin/heal-entrypoint.sh
    command:
      - influxdb3
      - serve
      - --node-id=ehm-influxdb
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
