services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - 'mongo-data:/data/db'
    networks:
      eh_network:
        ipv4_address: 172.1.0.7
    # Same host as EHM (the default): EHM reaches this via the eh_network
    # bridge IP above, not this published port, so MONGO_BIND_ADDRESS can
    # stay 127.0.0.1 - the port is only for local CLI access.
    # Separate instance from EHM: the eh_network bridge above is host-local
    # and EHM has no route into it, so this published port is the ONLY way
    # EHM reaches MongoDB - set MONGO_BIND_ADDRESS to this host's LAN IP
    # (or 0.0.0.0), open MONGO_PORT to just the EHM host's IP via your
    # firewall, and set MONGO_HOST in ehm-api/.env to this host's real LAN
    # IP, not 172.1.0.7. See install-mongodb.md.
    ports:
      - '${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?err}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?err}
volumes:
  mongo-data:
networks:
  eh_network:
    external: true
    name: eh_network
